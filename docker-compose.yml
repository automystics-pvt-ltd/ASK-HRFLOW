services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: hrflow
      MYSQL_DATABASE: hrflow
      MYSQL_USER: hrflow
      MYSQL_PASSWORD: hrflow
    volumes:
      - hrflow_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  hrflow_mysql_data: